<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trophy Design</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="trophy-container">

        <svg viewBox="0 0 500 500" class="trophy">

            <defs>
                <linearGradient id="purpleGradient" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#7c3aed"/>
                    <stop offset="100%" stop-color="#6d28d9"/>
                </linearGradient>
            </defs>

            <!-- Left Handle -->
            <path class="handle"
                d="M155 110
                   H100
                   C45 110 45 170 65 210
                   C85 250 125 270 165 270"/>

            <!-- Right Handle -->
            <path class="handle"
                d="M345 110
                   H400
                   C455 110 455 170 435 210
                   C415 250 375 270 335 270"/>

            <!-- Cup -->
            <path class="cup"
                d="M155 50
                   H345
                   C375 50 390 70 390 100
                   V130
                   C390 220 340 280 280 310
                   V370
                   C280 390 300 400 325 400
                   H350
                   C380 400 390 425 390 450
                   H110
                   C110 425 120 400 150 400
                   H175
                   C200 400 220 390 220 370
                   V310
                   C160 280 110 220 110 130
                   V100
                   C110 70 125 50 155 50
                   Z"/>

        </svg>

    </div>

</body>
</html>
